name: Build R36S / ArkOS Release

on:
  push:
    tags:
      - 'v*-r36s.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v0.3.2-r36s.1'
        required: true
        default: 'v0.3.2-r36s.1'

permissions:
  contents: write

jobs:
  build-r36s:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable ARM64 packages
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null << 'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            git \
            zip \
            unzip \
            xkb-data \
            protobuf-compiler \
            libssl-dev:arm64 \
            libopus-dev:arm64 \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswscale-dev:arm64 \
            libswresample-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libevdev-dev:arm64 \
            libudev-dev:arm64 \
            qtbase5-dev:arm64 \
            qttools5-dev:arm64 \
            libqt5svg5-dev:arm64 \
            qtmultimedia5-dev:arm64 \
            libqt5opengl5-dev:arm64 \
            qtbase5-dev \
            qttools5-dev
          pip3 install protobuf grpcio-tools

      - name: Build ARM64 Retro Chiaki
        env:
          R36S_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          export CXXFLAGS="-DCHIAKI_R36S_BUILD_VERSION=\\\"${R36S_VERSION#v}\\\""
          chmod +x packaging/build/ci-package.sh
          packaging/build/ci-package.sh "$R36S_VERSION"

      - name: Assemble R36S / ArkOS package
        env:
          R36S_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          chmod +x packaging/r36s/make-r36s-release.sh
          packaging/r36s/make-r36s-release.sh "$R36S_VERSION"
          rm -f dist/*portmaster-muos-h700.zip

      - name: Upload manual-build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: retro-chiaki-${{ inputs.version }}-r36s-arkos
          path: dist/*-r36s-arkos.zip

      - name: Create R36S GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: Retro Chiaki R36S / ArkOS ${{ github.ref_name }}
          body: |
            Experimental R36S / ArkOS release by ArkDrakken.

            Target: R36S, RK3326, Mali-G31, ArkOS, 640x480.

            This package keeps its compatibility runtime private to Retro Chiaki and does not replace ArkOS system libraries.

            See README-R36S.md and NOTICE-R36S.md in the repository/package for installation, status and attribution.
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*-r36s-arkos.zip
